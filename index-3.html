<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Buku Mutabaah</title>
<style>
:root{--bg:#F2F1E7;--sf:#FBFAF4;--ink:#10231D;--mu:#586C63;--ln:#DBDED0;--pr:#0E4A3B;--on:#F8F5E8;--gd:#A47F28;--wn:#A5452F;--ok:#DCEADF}
@media(prefers-color-scheme:dark){:root{--bg:#0A1512;--sf:#101F1A;--ink:#ECE8D8;--mu:#9DB0A6;--ln:#203429;--pr:#1F7A60;--on:#F4F1E4;--gd:#D6B463;--wn:#D8705A;--ok:#173026}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,sans-serif;padding:calc(16px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom))}
main{max-width:720px;margin:0 auto}
h1,h2,.big{font-family:Georgia,"Iowan Old Style",serif;font-weight:600;margin:0}
h1{font-size:34px}h2{font-size:24px}
.mu{color:var(--mu)}small{font-size:12.5px}
a{color:var(--pr);font-weight:600}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:16px;margin-top:12px}
.tap{cursor:pointer}
.big{font-size:46px;line-height:1.05;color:var(--pr);margin-top:6px}.big small{font-size:16px;font-family:system-ui;color:var(--mu);font-weight:400}
.bar{height:6px;border-radius:9px;background:var(--ln);margin:8px 0}.bar i{display:block;height:100%;border-radius:9px;background:var(--gd)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
input,select{flex:1 1 130px;min-width:0;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
button{padding:10px 16px;border:0;border-radius:10px;background:var(--pr);color:var(--on);font:600 14px system-ui;cursor:pointer}
button.g{background:none;color:var(--wn);padding:4px 8px}
:focus-visible{outline:2px solid var(--gd);outline-offset:2px}
.chip{font-size:12px;padding:2px 9px;border-radius:9px;background:var(--ok)}
.chip.Ulang{background:#F6DDD5;color:#7A2A1A}.chip.Cukup{background:#EDE1BC;color:#7A5D12}
.h{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:10px 0;border-top:1px solid var(--ln)}
#gbtn{margin-top:18px}
</style></head><body><main id="app"></main>
<script>
const API='ISI_URL_WEB_APP_APPS_SCRIPT';
let token=localStorage.t||'',D=null,view='list',sel=null,err='',step=0,em='';
const $=i=>document.getElementById(i),v=i=>$(i).value.trim();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('sv');

async function api(action,data){
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({token,action,data})});
  const j=await r.json();if(j.error)throw new Error(j.error);return j;
}
async function run(action,data){
  try{D=await api(action,data);err='';}catch(e){err=e.message;if(/Sesi/.test(err)){D=null;localStorage.t=token='';}}
  render();
}
function out(){localStorage.t=token='';D=null;sel=null;view='list';render();}

function stat(id){
  const S=D.setoran.filter(x=>x.santriId===id),P={};
  S.filter(x=>x.jenis==='baru').forEach(x=>{for(let p=+x.halStart;p<=+x.halEnd;p++)(P[x.juz]??=new Set()).add(p)});
  let full=0,tot=0;Object.values(P).forEach(s=>{tot+=s.size;if(s.size>=20)full++});
  const td=S.filter(x=>x.jenis==='baru'&&x.tanggal===today()).reduce((a,x)=>a+(+x.halEnd-+x.halStart+1),0);
  const mj=S.filter(x=>x.jenis==='murajaah').map(x=>x.tanggal).sort().pop();
  return{full,sisa:tot-full*20,tot,td,mj};
}

const head=()=>`<h1>Buku Mutabaah</h1><p class="mu"><small>${esc(D.email)}</small> &nbsp;<a href="#" onclick="out();return false">Keluar</a>${D.admin?` &nbsp;<a href="#" onclick="view=view=='akses'?'list':'akses';sel=null;render();return false">${view=='akses'?'Santri':'Akses'}</a>`:''}</p>${err?`<p style="color:var(--wn)">${esc(err)}</p>`:''}`;

function login(){return`<h1>Buku Mutabaah</h1><p class="mu">${step?`Kode 6 digit dikirim ke <b>${esc(em)}</b> kalau emailnya terdaftar. Cek juga folder spam.`:'Masukkan email yang didaftarkan guru. Kode masuk akan dikirim ke email itu.'}</p>${err?`<p style="color:var(--wn)">${esc(err)}</p>`:''}<div class="row">${step?`<input id="k" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="Kode 6 digit"><button onclick="verC()">Masuk</button></div><p><a href="#" onclick="step=0;err='';render();return false">Ganti email</a></p>`:`<input id="e" type="email" autocomplete="email" placeholder="Email" value="${esc(em)}"><button onclick="sendC()">Kirim kode</button></div>`}`}
async function sendC(){em=v('e').toLowerCase();try{await api('sendCode',{email:em});step=1;err='';}catch(e){err=e.message}render();}
async function verC(){try{const j=await api('verifyCode',{email:em,code:v('k')});token=localStorage.t=j.token;step=0;await run('load',{});}catch(e){err=e.message;render();}}

function list(){
  return head()+(D.admin?`<div class="card"><b>Tambah santri</b><div class="row"><input id="n" placeholder="Nama"><input id="h" placeholder="Halaqah"><input id="t" type="number" min="0" placeholder="Target hal/hari"><button onclick="run('addSantri',{nama:v('n'),halaqah:v('h'),target:v('t')})">Simpan santri</button></div></div>`:'')+
  (D.santri.map(s=>{const t=stat(s.id);return`<div class="card tap" onclick="sel='${esc(s.id)}';render()"><b>${esc(s.nama)}</b> <span class="mu">${esc(s.halaqah)}</span><div class="big">${t.full} juz <small>+ ${t.sisa} halaman</small></div><div class="bar"><i style="width:${t.tot/604*100}%"></i></div><small class="mu">Hari ini ${t.td}${s.target?' dari '+esc(s.target):''} halaman${t.mj?' · muraja\'ah terakhir '+esc(t.mj):''}</small></div>`}).join('')||'<p class="mu">Belum ada santri yang bisa kamu lihat.</p>');
}

function detail(){
  const s=D.santri.find(x=>x.id===sel);if(!s){sel=null;return list()}
  const t=stat(s.id),L=D.setoran.filter(x=>x.santriId===s.id).sort((a,b)=>b.tanggal.localeCompare(a.tanggal));
  const canNote=L.length&&L[0].nilai!==undefined||D.admin;
  return head()+`<p><a href="#" onclick="sel=null;render();return false">← Semua santri</a></p><h2>${esc(s.nama)}</h2><p class="mu">${esc(s.halaqah)}</p><div class="big">${t.full} juz <small>+ ${t.sisa} halaman · ${t.tot} dari 604</small></div><div class="bar"><i style="width:${t.tot/604*100}%"></i></div>`+
  (D.admin?`<div class="card"><b>Catat setoran</b><div class="row"><input id="d" type="date" value="${today()}"><select id="j"><option value="baru">Hafalan baru</option><option value="murajaah">Muraja'ah</option></select><input id="ju" type="number" min="1" max="30" placeholder="Juz 1-30"><input id="a" type="number" min="1" max="20" placeholder="Halaman dari (1-20)"><input id="b" type="number" min="1" max="20" placeholder="sampai (1-20)"><select id="nl"><option>Lancar</option><option>Cukup</option><option>Ulang</option></select><input id="c" placeholder="Catatan (tajwid, ayat tertukar, ...)"><button onclick="addSet('${esc(s.id)}')">Simpan setoran</button></div></div><p><button class="g" onclick="if(confirm('Hapus santri dan seluruh riwayatnya?')){sel=null;run('delSantri',{id:'${esc(s.id)}'})}">Hapus santri</button></p>`:'')+
  `<div class="card"><b>Riwayat</b>${L.map(x=>`<div class="h"><div><b>${esc(x.tanggal)}</b> · ${x.jenis=='baru'?'Baru':'Muraja\'ah'} · Juz ${esc(x.juz)} hal ${esc(x.halStart)}-${esc(x.halEnd)}${x.nilai?` <span class="chip ${esc(x.nilai)}">${esc(x.nilai)}</span>`:''}${x.catatan?`<br><small class="mu">${esc(x.catatan)}</small>`:''}</div>${D.admin?`<button class="g" onclick="run('delSetoran',{id:'${esc(x.id)}'})">Hapus</button>`:''}</div>`).join('')||'<p class="mu">Belum ada setoran.</p>'}</div>`;
}
function addSet(id){
  const a=+v('a'),b=+v('b'),ju=+v('ju');
  if(!(ju>=1&&ju<=30&&a>=1&&b>=a&&b<=20)){err='Isi juz 1-30 dan halaman 1-20 (dari ≤ sampai).';return render()}
  run('addSetoran',{santriId:id,tanggal:v('d'),jenis:v('j'),juz:ju,halStart:a,halEnd:b,nilai:v('nl'),catatan:v('c')});
}

function akses(){
  return head()+`<h2>Akses</h2><p class="mu">Hanya akun di daftar ini yang bisa melihat data. Level: lihat (progres), catatan (progres + nilai + catatan), admin (kelola semua).</p><div class="card"><div class="row"><input id="e" type="email" placeholder="Email Google"><select id="s"><option value="*">Semua santri</option>${D.santri.map(s=>`<option value="${esc(s.id)}">${esc(s.nama)}</option>`).join('')}</select><select id="l"><option>lihat</option><option>catatan</option><option>admin</option></select><button onclick="run('addAkses',{email:v('e'),santriId:v('s'),level:v('l')})">Beri akses</button></div></div><div class="card">${D.akses.map(r=>{const s=D.santri.find(x=>x.id===r.santriId);return`<div class="h"><div><b>${esc(r.email)}</b><br><small class="mu">${s?esc(s.nama):'Semua santri'} · ${esc(r.level)}</small></div><button class="g" onclick="run('delAkses',{id:'${esc(r.id)}'})">Cabut</button></div>`}).join('')||'<p class="mu">Belum ada akses. Pemilik Sheet otomatis admin.</p>'}</div>`;
}

function render(){
  $('app').innerHTML=!D?login():view=='akses'?akses():sel?detail():list();
}
token?run('load',{}):render();
</script></body></html>
